<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV-XRAY | Advanced Screen Overlay</title>
    <style>
        :root {
            --neon-green: #00ff00;
            --neon-cyan: #00ffff;
            --bg-dark: rgba(10, 10, 10, 0.9);
            --panel-border: rgba(0, 255, 255, 0.3);
            --text-main: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Overlay Canvas - O X-Ray */
        #overlayCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            pointer-events: none;
        }

        /* Loader de Inicialização */
        #loaderOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--neon-cyan);
            transition: opacity 0.5s ease;
        }

        .progress-container {
            width: 300px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        /* Painel de Controle */
        #controlPanel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            background: var(--bg-dark);
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            color: var(--text-main);
            z-index: 1000001;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            user-select: none;
        }

        #panelHeader {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            cursor: move;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 13px;
        }

        #panelContent {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-green);
            cursor: pointer;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-row:hover { color: var(--neon-cyan); }

        button {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        #stats {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            color: var(--neon-green);
            border-left: 3px solid var(--neon-green);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loaderOverlay">
        <div style="font-size: 20px; font-weight: bold; letter-spacing: 2px;">CARREGANDO NÚCLEO CV</div>
        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <div id="loaderStatus" style="margin-top: 10px; font-size: 12px;">Iniciando OpenCV.js...</div>
    </div>

    <!-- Overlay -->
    <canvas id="overlayCanvas"></canvas>

    <!-- Painel -->
    <div id="controlPanel">
        <div id="panelHeader">
            <span>CV-XRAY ENGINE</span>
            <span id="statusDot" style="color: red;">● OFF</span>
        </div>
        <div id="panelContent">
            <button id="btnStart">INICIAR CAPTURA</button>

            <div class="input-group">
                <div class="label-row"><span>TEMPLATE (BAÚ)</span><span id="tplStatus">Vazio</span></div>
                <button onclick="document.getElementById('fileInput').click()">CARREGAR PNG</button>
                <input type="file" id="fileInput" class="hidden" accept="image/png">
            </div>

            <div class="input-group">
                <div class="label-row"><span>SENSIBILIDADE</span><span id="valThresh">0.80</span></div>
                <input type="range" id="rangeThresh" min="0.5" max="1.0" step="0.01" value="0.80">
            </div>

            <div class="input-group">
                <div class="label-row"><span>ESCALA</span><span id="valScale">1.0x</span></div>
                <input type="range" id="rangeScale" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>

            <label class="toggle-row">
                <input type="checkbox" id="chkAutoClick"> AUTO-CLICK (HUMANO)
            </label>

            <label class="toggle-row">
                <input type="checkbox" id="chkLines" checked> LINHAS DE MIRA
            </label>

            <button id="btnReset" style="border-color: #ff4444; color: #ff4444;">RESETAR TUDO</button>

            <div id="stats">
                FPS: 0 | OBJS: 0 | RES: 0x0
            </div>
        </div>
    </div>

    <script>
        /**
         * CV-XRAY ENGINE
         * Implementação de Visão Computacional para Overlay de Jogos
         */
        const App = (() => {
            // --- ESTADO GLOBAL ---
            const State = {
                active: false,
                threshold: 0.80,
                scale: 1.0,
                autoClick: false,
                drawLines: true,
                template: null,
                fps: 0,
                objs: 0,
                lastClick: 0,
                res: { w: 0, h: 0 },
                downscale: 2 // Reduz resolução para processamento rápido
            };

            // --- ELEMENTOS UI ---
            const UI = {
                btnStart: document.getElementById('btnStart'),
                fileInput: document.getElementById('fileInput'),
                rangeThresh: document.getElementById('rangeThresh'),
                rangeScale: document.getElementById('rangeScale'),
                chkAutoClick: document.getElementById('chkAutoClick'),
                chkLines: document.getElementById('chkLines'),
                stats: document.getElementById('stats'),
                statusDot: document.getElementById('statusDot'),
                valThresh: document.getElementById('valThresh'),
                valScale: document.getElementById('valScale'),
                tplStatus: document.getElementById('tplStatus'),
                overlay: document.getElementById('overlayCanvas'),
                ctx: document.getElementById('overlayCanvas').getContext('2d'),
                loader: document.getElementById('loaderOverlay'),
                progressBar: document.getElementById('progressBar'),
                loaderStatus: document.getElementById('loaderStatus')
            };

            // --- GERENCIADOR DE CAPTURA ---
            const Capture = {
                stream: null,
                video: document.createElement('video'),
                canvas: document.createElement('canvas'),
                ctx: null,

                async init() {
                    try {
                        this.stream = await navigator.mediaDevices.getDisplayMedia({
                            video: { cursor: "never" },
                            audio: false
                        });
                        this.video.srcObject = this.stream;
                        this.video.play();
                        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                        
                        this.video.onloadedmetadata = () => {
                            State.res.w = this.video.videoWidth;
                            State.res.h = this.video.videoHeight;
                            UI.overlay.width = window.innerWidth;
                            UI.overlay.height = window.innerHeight;
                        };
                        return true;
                    } catch (e) {
                        alert("Erro ao capturar tela: " + e.message);
                        return false;
                    }
                },
                stop() {
                    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                }
            };

            // --- MOTOR DE VISÃO (OpenCV) ---
            const CV = {
                process() {
                    if (!State.active || !State.template) return;

                    const { w, h } = State.res;
                    const ds = State.downscale;

                    // Downscaling para performance (FPS)
                    Capture.canvas.width = w / ds;
                    Capture.canvas.height = h / ds;
                    Capture.ctx.drawImage(Capture.video, 0, 0, w / ds, h / ds);

                    let frame = cv.imread(Capture.canvas);
                    let gray = new cv.Mat();
                    cv.cvtColor(frame, gray, cv.COLOR_RGBA2GRAY);

                    // Ajuste de escala do template
                    let resizedTpl = new cv.Mat();
                    let tw = State.template.cols * State.scale;
                    let th = State.template.rows * State.scale;
                    cv.resize(State.template, resizedTpl, new cv.Size(tw, th));

                    let grayTpl = new cv.Mat();
                    cv.cvtColor(resizedTpl, grayTpl, cv.COLOR_RGBA2GRAY);

                    // Template Matching
                    let result = new cv.Mat();
                    cv.matchTemplate(gray, grayTpl, result, cv.TM_CCOEFF_NORMED);

                    const detections = [];
                    const data = result.data32F;
                    const rw = result.cols;
                    const rh = result.rows;

                    for (let y = 0; y < rh; y++) {
                        for (let x = 0; x < rw; x++) {
                            const score = data[y * rw + x];
                            if (score >= State.threshold) {
                                detections.push({ x: x * ds, y: y * ds, w: tw * ds, h: th * ds });
                                x += Math.floor(tw / 2); // Evita duplicatas
                            }
                        }
                    }

                    State.objs = detections.length;
                    Interaction.render(detections);

                    // Limpeza de Memória (Crucial para não travar o browser)
                    frame.delete(); gray.delete(); resizedTpl.delete(); grayTpl.delete(); result.delete();
                }
            };

            // --- INTERAÇÃO E RENDER ---
            const Interaction = {
                render(detections) {
                    UI.ctx.clearRect(0, 0, UI.overlay.width, UI.overlay.height);
                    if (detections.length === 0) return;

                    const sx = window.innerWidth / State.res.w;
                    const sy = window.innerHeight / State.res.h;
                    const cx = window.innerWidth / 2;
                    const cy = window.innerHeight / 2;

                    let closest = null;
                    let minDist = Infinity;

                    detections.forEach(d => {
                        const rx = d.x * sx;
                        const ry = d.y * sy;
                        const rw = d.w * sx;
                        const rh = d.h * sy;

                        // Desenho X-Ray
                        UI.ctx.strokeStyle = '#00ff00';
                        UI.ctx.lineWidth = 2;
                        UI.ctx.strokeRect(rx, ry, rw, rh);

                        if (State.drawLines) {
                            UI.ctx.beginPath();
                            UI.ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
                            UI.ctx.moveTo(cx, cy);
                            UI.ctx.lineTo(rx + rw/2, ry + rh/2);
                            UI.ctx.stroke();
                        }

                        const dist = Math.hypot(cx - (rx + rw/2), cy - (ry + rh/2));
                        if (dist < minDist) {
                            minDist = dist;
                            closest = { x: rx + rw/2, y: ry + rh/2 };
                        }
                    });

                    if (State.autoClick && closest) this.click(closest.x, closest.y);
                },

                click(x, y) {
                    const now = Date.now();
                    if (now - State.lastClick < 1500) return;

                    const jX = x + (Math.random() * 10 - 5);
                    const jY = y + (Math.random() * 10 - 5);

                    const ev = new MouseEvent('click', {
                        clientX: jX, clientY: jY, bubbles: true, view: window
                    });
                    document.elementFromPoint(jX, jY)?.dispatchEvent(ev);
                    State.lastClick = now;
                }
            };

            // --- LOOP PRINCIPAL ---
            function mainLoop() {
                if (State.active) {
                    const t0 = performance.now();
                    CV.process();
                    State.fps = Math.round(1000 / (performance.now() - t0));
                }
                UI.stats.innerText = `FPS: ${State.fps} | OBJS: ${State.objs} | RES: ${State.res.w}x${State.res.h}`;
                requestAnimationFrame(mainLoop);
            }

            return {
                async init() {
                    // Carregamento do OpenCV com Barra de Progresso
                    const loadCV = () => {
                        return new Promise((resolve) => {
                            const script = document.createElement('script');
                            script.src = "https://docs.opencv.org/4.7.0/opencv.js";
                            
                            // Simulação de progresso enquanto o browser baixa o arquivo grande
                            let prog = 0;
                            const interval = setInterval(() => {
                                prog += Math.random() * 15;
                                if (prog > 90) prog = 90;
                                UI.progressBar.style.width = prog + "%";
                                UI.loaderStatus.innerText = `Baixando Núcleo CV... ${Math.round(prog)}%`;
                            }, 200);

                            script.onload = () => {
                                clearInterval(interval);
                                UI.progressBar.style.width = "100%";
                                UI.loaderStatus.innerText = "Núcleo Pronto!";
                                setTimeout(() => {
                                    UI.loader.style.opacity = "0";
                                    setTimeout(() => UI.loader.classList.add('hidden'), 500);
                                    resolve();
                                }, 500);
                            };
                            document.head.appendChild(script);
                        });
                    };

                    await loadCV();

                    // Eventos
                    UI.btnStart.onclick = async () => {
                        if (!State.active) {
                            if (await Capture.init()) {
                                State.active = true;
                                UI.btnStart.innerText = "PARAR CAPTURA";
                                UI.statusDot.innerText = "● ON";
                                UI.statusDot.style.color = "var(--neon-green)";
                            }
                        } else {
                            State.active = false;
                            Capture.stop();
                            UI.btnStart.innerText = "INICIAR CAPTURA";
                            UI.statusDot.innerText = "● OFF";
                            UI.statusDot.style.color = "red";
                        }
                    };

                    UI.fileInput.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const c = document.createElement('canvas');
                                c.width = img.width; c.height = img.height;
                                c.getContext('2d').drawImage(img, 0, 0);
                                if (State.template) State.template.delete();
                                State.template = cv.imread(c);
                                UI.tplStatus.innerText = "Ativo";
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    };

                    UI.rangeThresh.oninput = (e) => {
                        State.threshold = parseFloat(e.target.value);
                        UI.valThresh.innerText = State.threshold.toFixed(2);
                    };

                    UI.rangeScale.oninput = (e) => {
                        State.scale = parseFloat(e.target.value);
                        UI.valScale.innerText = State.scale.toFixed(1) + "x";
                    };

                    UI.chkAutoClick.onchange = (e) => State.autoClick = e.target.checked;
                    UI.chkLines.onchange = (e) => State.drawLines = e.target.checked;
                    
                    document.getElementById('btnReset').onclick = () => location.reload();

                    // Draggable
                    const header = document.getElementById('panelHeader');
                    let drag = false, ox, oy;
                    header.onmousedown = (e) => {
                        drag = true;
                        ox = e.clientX - document.getElementById('controlPanel').offsetLeft;
                        oy = e.clientY - document.getElementById('controlPanel').offsetTop;
                    };
                    window.onmousemove = (e) => {
                        if (!drag) return;
                        document.getElementById('controlPanel').style.left = (e.clientX - ox) + 'px';
                        document.getElementById('controlPanel').style.top = (e.clientY - oy) + 'px';
                        document.getElementById('controlPanel').style.right = 'auto';
                    };
                    window.onmouseup = () => drag = false;

                    mainLoop();
                }
            };
        })();

        // Inicia a aplicação e o loop de renderização imediatamente
        window.onload = async () => {
            await App.init();
        };
            };
})();

// Inicia a aplicação
window.onload = () => App.init();
    </script>
</body>
</html>
